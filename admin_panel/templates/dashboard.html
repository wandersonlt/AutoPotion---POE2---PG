<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; }
        .nav-menu {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        .nav-menu a {
            color: #ccc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .nav-menu a:hover, .nav-menu a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card h3 { font-size: 2rem; color: #00d4ff; }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <button class="logout-btn" onclick="adminLogout()">Sair</button>
        </div>
        <div class="nav-menu">
            <a href="/admin/dashboard" class="active">Dashboard</a>
            <a href="/admin/licenses">Licenças</a>
            <a href="/admin/plans">Planos</a>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h3 id="total-users">0</h3><p>Total de Usuários</p></div>
            <div class="stat-card"><h3 id="total-licenses">0</h3><p>Total de Licenças</p></div>
            <div class="stat-card"><h3 id="active-licenses">0</h3><p>Licenças Ativas</p></div>
            <div class="stat-card"><h3 id="expired-licenses">0</h3><p>Licenças Expiradas</p></div>
            <div class="stat-card"><h3 id="blocked-licenses">0</h3><p>Licenças Bloqueadas</p></div>
            <div class="stat-card"><h3 id="revenue">R$ 0,00</h3><p>Receita (30 dias)</p></div>
        </div>
    </div>
    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/admin/login';

        async function apiRequest(endpoint) {
            const response = await fetch(`${API_URL}${endpoint}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            return response.json();
        }

        async function loadDashboard() {
            const data = await apiRequest('/api/admin/dashboard/stats');
            document.getElementById('total-users').textContent = data.total_users || 0;
            document.getElementById('total-licenses').textContent = data.total_licenses || 0;
            document.getElementById('active-licenses').textContent = data.active_licenses || 0;
            document.getElementById('expired-licenses').textContent = data.expired_licenses || 0;
            document.getElementById('blocked-licenses').textContent = data.blocked_licenses || 0;
            document.getElementById('revenue').textContent = `R$ ${(data.revenue_last_30_days || 0).toFixed(2)}`;
        }

        function adminLogout() {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login';
        }

        loadDashboard();
    </script>
</body>
</html>
