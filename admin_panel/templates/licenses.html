<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Licenças - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; }
        .nav-menu {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        .nav-menu a {
            color: #ccc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .nav-menu a:hover, .nav-menu a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,212,255,0.2); color: #00d4ff; }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .status-active { color: #28a745; }
        .status-expired { color: #dc3545; }
        .status-blocked { color: #ffc107; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .plan-option {
            background: rgba(0,212,255,0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .plan-option:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: scale(1.02);
        }
        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔑 Gerenciar Licenças</h1>
            <button class="logout-btn" onclick="adminLogout()">Sair</button>
        </div>
        <div class="nav-menu">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/licenses" class="active">Licenças</a>
            <a href="/admin/plans">Planos</a>
        </div>
        <button class="btn" onclick="showLicenseModal()">➕ Nova Licença</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Chave</th><th>Usuário</th><th>Plano</th><th>Status</th><th>Machine ID</th><th>Criada</th><th>Expira</th><th>Ações</th></tr>
                </thead>
                <tbody id="licenses-table">
                    <tr><td colspan="8">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para escolher o plano -->
    <div id="license-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeLicenseModal()">&times;</span>
            <h2>Escolha o Plano</h2>
            <div id="plans-list"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/admin/login';

        async function apiRequest(endpoint, method = 'GET', data = null) {
            const options = { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('admin_token');
                window.location.href = '/admin/login';
                return null;
            }
            return response.json();
        }

        async function loadLicenses() {
            const data = await apiRequest('/api/admin/licenses?skip=0&limit=100');
            const tbody = document.getElementById('licenses-table');
            if (data && data.licenses) {
                tbody.innerHTML = data.licenses.map(l => {
                    let statusClass = '';
                    if (l.status === 'ACTIVE') statusClass = 'status-active';
                    else if (l.status === 'EXPIRED') statusClass = 'status-expired';
                    else if (l.status === 'BLOCKED') statusClass = 'status-blocked';
                    
                    return `
                    <tr>
                        <td><code>${l.key}</code></td>
                        <td>${l.user || '-'}</td>
                        <td>${l.plan || '-'}</td>
                        <td class="${statusClass}">${l.status}</td>
                        <td>${l.machine_id === 'Not assigned' ? '⚠️ Aguardando ativação' : (l.machine_id ? l.machine_id.substring(0,20)+'...' : '-')}</td>
                        <td>${new Date(l.created_at).toLocaleDateString()}</td>
                        <td>${l.expires_at ? new Date(l.expires_at).toLocaleDateString() : 'Lifetime'}</td>
                        <td>
                            <button onclick="blockLicense('${l.key}')">Bloquear</button>
                            <button onclick="deleteLicense('${l.key}')">Excluir</button>
                        </td>
                    </tr>
                `}).join('');
            }
        }

        async function showLicenseModal() {
            // Carregar planos disponíveis
            const plans = await apiRequest('/api/admin/plans');
            const plansList = document.getElementById('plans-list');
            
            if (plans && Array.isArray(plans)) {
                plansList.innerHTML = plans.map(p => `
                    <div class="plan-option" onclick="createLicense(${p.id}, '${p.name}')">
                        <strong>${p.name}</strong><br>
                        ${p.validity_days ? p.validity_days + ' dias de validade' : 'Vitalício'} - R$ ${p.price.toFixed(2)}
                    </div>
                `).join('');
            }
            
            document.getElementById('license-modal').style.display = 'flex';
        }

        async function createLicense(planId, planName) {
            closeLicenseModal();
            
            // Usar sempre o usuário admin (ID 1) para criar a licença
            const userId = 1;
            
            const result = await apiRequest('/api/admin/licenses', 'POST', { 
                user_id: userId, 
                plan_id: planId 
            });
            
            if (result && result.success) {
                alert(`✅ Licença criada com sucesso!\n\nPlano: ${planName}\nChave: ${result.license.key}\n\n⚠️ O usuário ativará a licença em seu computador.`);
                loadLicenses();
            } else {
                alert('❌ Erro ao criar licença');
            }
        }

        async function blockLicense(key) {
            if (!confirm('Bloquear esta licença?')) return;
            await apiRequest(`/api/admin/licenses/${key}/block`, 'PUT');
            loadLicenses();
        }

        async function deleteLicense(key) {
            if (!confirm('Excluir esta licença? Esta ação não pode ser desfeita.')) return;
            await apiRequest(`/api/admin/licenses/${key}`, 'DELETE');
            loadLicenses();
        }

        function closeLicenseModal() {
            document.getElementById('license-modal').style.display = 'none';
        }

        function adminLogout() {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login';
        }

        loadLicenses();
    </script>
</body>
</html>
