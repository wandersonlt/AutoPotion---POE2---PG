<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Planos - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; }
        .nav-menu {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        .nav-menu a {
            color: #ccc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .nav-menu a:hover, .nav-menu a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,212,255,0.2); color: #00d4ff; }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Planos Disponíveis</h1>
            <button class="logout-btn" onclick="adminLogout()">Sair</button>
        </div>
        <div class="nav-menu">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/licenses">Licenças</a>
            <a href="/admin/plans" class="active">Planos</a>
        </div>
        <button class="btn" onclick="location.href='/admin/plans/create'">➕ Novo Plano</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Nome</th><th>Validade</th><th>Preço</th><th>Stripe Price ID</th><th>Stripe Product ID</th></tr>
                </thead>
                <tbody id="plans-table">
                    <tr><td colspan="5">Carregando......</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/admin/login';

        async function apiRequest(endpoint) {
            const response = await fetch(`${API_URL}${endpoint}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.status === 401) {
                localStorage.removeItem('admin_token');
                window.location.href = '/admin/login';
                return null;
            }
            return response.json();
        }

        async function loadPlans() {
            const data = await apiRequest('/api/admin/plans');
            const tbody = document.getElementById('plans-table');
            if (data && Array.isArray(data)) {
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.validity_days ? p.validity_days + ' dias' : 'Ilimitado'}</td>
                        <td>R$ ${p.price.toFixed(2)}</td>
                        <td><code>${p.stripe_price_id || '-'}</code></td>
                        <td><code>${p.stripe_product_id || '-'}</code></td>
                    </tr>
                `).join('');
            }
        }

        function adminLogout() {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login';
        }

        loadPlans();
    </script>
</body>
</html>
