{% extends "base.html" %}

{% block title %}Gerenciar Planos{% endblock %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>💰 Gerenciar Planos</h1>
        <div class="user-info">
            <span>Bem-vindo, Admin</span>
            <button class="logout-btn" onclick="adminLogout()">Sair</button>
        </div>
    </div>
    
    <div class="nav-menu">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/licenses">Licenças</a>
        <a href="/admin/plans" class="active">Planos</a>
    </div>
    
    <div style="margin-bottom: 20px;">
        <button class="btn btn-primary" onclick="showCreatePlanModal()">➕ Novo Plano</button>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Validade</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="plans-table-body">
                <tr><td colspan="6">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para criar/editar plano -->
<div id="plan-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePlanModal()">&times;</span>
        <h2 id="plan-modal-title">Criar Plano</h2>
        <input type="hidden" id="plan-id">
        <div class="form-group">
            <label>Nome do Plano</label>
            <input type="text" id="plan-name" placeholder="Ex: 30 Days">
        </div>
        <div class="form-group">
            <label>Tipo</label>
            <input type="text" id="plan-type" placeholder="Ex: THIRTY_DAYS">
        </div>
        <div class="form-group">
            <label>Dias de Validade (deixe em branco para ilimitado)</label>
            <input type="number" id="plan-validity-days" placeholder="30">
        </div>
        <div class="form-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="plan-price" placeholder="29.90">
        </div>
        <button class="btn btn-primary" onclick="savePlan()">Salvar</button>
    </div>
</div>
{% endblock %}
