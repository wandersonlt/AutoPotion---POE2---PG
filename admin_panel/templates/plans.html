<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Planos - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; }
        .nav-menu {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        .nav-menu a {
            color: #ccc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .nav-menu a:hover, .nav-menu a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,212,255,0.2); color: #00d4ff; }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            background: rgba(0,0,0,0.5);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Gerenciar Planos</h1>
            <button class="logout-btn" onclick="adminLogout()">Sair</button>
        </div>
        <div class="nav-menu">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/licenses">Licenças</a>
            <a href="/admin/plans" class="active">Planos</a>
        </div>
        <button class="btn" onclick="showCreatePlanModal()">➕ Novo Plano</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Nome</th><th>Tipo</th><th>Validade</th><th>Preço</th><th>Stripe Price ID</th><th>Stripe Product ID</th><th>Status</th><th>Ações</th></tr>
                </thead>
                <tbody id="plans-table">
                    <tr><td colspan="8">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="plan-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Criar Plano</h2>
            <input type="hidden" id="plan-id">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="plan-name" placeholder="Ex: 30 Days">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <input type="text" id="plan-type" placeholder="Ex: THIRTY_DAYS">
            </div>
            <div class="form-group">
                <label>Dias de Validade</label>
                <input type="number" id="plan-validity-days" placeholder="30">
            </div>
            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" step="0.01" id="plan-price" placeholder="29.90">
            </div>
            <div class="form-group">
                <label>Stripe Price ID</label>
                <input type="text" id="plan-stripe-price-id" placeholder="price_xxx">
            </div>
            <div class="form-group">
                <label>Stripe Product ID</label>
                <input type="text" id="plan-stripe-product-id" placeholder="prod_xxx">
            </div>
            <button class="btn" onclick="savePlan()" style="width:100%;">Salvar</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('admin_token');
        
        if (!token) {
            window.location.href = '/admin/login';
        }

        async function apiRequest(endpoint, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            };
            if (data) options.body = JSON.stringify(data);
            
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('admin_token');
                window.location.href = '/admin/login';
                return null;
            }
            return await response.json();
        }

        async function loadPlans() {
            const data = await apiRequest('/api/admin/plans');
            const tbody = document.getElementById('plans-table');
            if (data && Array.isArray(data)) {
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.type}</td>
                        <td>${p.validity_days ? p.validity_days + ' dias' : 'Ilimitado'}</td>
                        <td>R$ ${p.price.toFixed(2)}</td>
                        <td><code>${p.stripe_price_id || '-'}</code></td>
                        <td><code>${p.stripe_product_id || '-'}</code></td>
                        <td>${p.is_active ? '✅ Ativo' : '❌ Inativo'}</td>
                        <td>
                            <button class="btn-warning" style="padding:5px 10px;margin:0 2px;" onclick="editPlan(${p.id})">Editar</button>
                            <button class="btn-danger" style="padding:5px 10px;margin:0 2px;" onclick="deletePlan(${p.id})">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function showCreatePlanModal() {
            document.getElementById('modal-title').textContent = 'Criar Plano';
            document.getElementById('plan-id').value = '';
            document.getElementById('plan-name').value = '';
            document.getElementById('plan-type').value = '';
            document.getElementById('plan-validity-days').value = '';
            document.getElementById('plan-price').value = '';
            document.getElementById('plan-stripe-price-id').value = '';
            document.getElementById('plan-stripe-product-id').value = '';
            document.getElementById('plan-modal').style.display = 'flex';
        }

        async function editPlan(id) {
            const data = await apiRequest('/api/admin/plans');
            if (data && Array.isArray(data)) {
                const plan = data.find(p => p.id === id);
                if (plan) {
                    document.getElementById('modal-title').textContent = 'Editar Plano';
                    document.getElementById('plan-id').value = plan.id;
                    document.getElementById('plan-name').value = plan.name;
                    document.getElementById('plan-type').value = plan.type;
                    document.getElementById('plan-validity-days').value = plan.validity_days || '';
                    document.getElementById('plan-price').value = plan.price;
                    document.getElementById('plan-stripe-price-id').value = plan.stripe_price_id || '';
                    document.getElementById('plan-stripe-product-id').value = plan.stripe_product_id || '';
                    document.getElementById('plan-modal').style.display = 'flex';
                }
            }
        }

        async function savePlan() {
            const id = document.getElementById('plan-id').value;
            const data = {
                name: document.getElementById('plan-name').value,
                type: document.getElementById('plan-type').value,
                validity_days: document.getElementById('plan-validity-days').value ? parseInt(document.getElementById('plan-validity-days').value) : null,
                price: parseFloat(document.getElementById('plan-price').value),
                stripe_price_id: document.getElementById('plan-stripe-price-id').value || null,
                stripe_product_id: document.getElementById('plan-stripe-product-id').value || null
            };
            
            let result;
            if (id) {
                result = await apiRequest(`/api/admin/plans/${id}`, 'PUT', data);
            } else {
                result = await apiRequest('/api/admin/plans', 'POST', data);
            }
            
            if (result && result.success) {
                alert('Plano salvo com sucesso!');
                closeModal();
                loadPlans();
            } else {
                alert('Erro ao salvar plano');
            }
        }

        async function deletePlan(id) {
            if (!confirm('Excluir este plano?')) return;
            const result = await apiRequest(`/api/admin/plans/${id}`, 'DELETE');
            if (result && result.success) {
                alert('Plano excluído!');
                loadPlans();
            }
        }

        function closeModal() {
            document.getElementById('plan-modal').style.display = 'none';
        }

        function adminLogout() {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login';
        }

        loadPlans();
    </script>
</body>
</html>
